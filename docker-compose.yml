version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: trade_intel_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trade_intel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: trade_intel_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trade_intel_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/trade_intel
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - ENV=production
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/datasets:/app/backend/datasets

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trade_intel_celery_worker
    restart: always
    command: celery -A backend.orchestrator.celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/trade_intel
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/datasets:/app/backend/datasets

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trade_intel_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
